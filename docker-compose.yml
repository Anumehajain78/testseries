# Local development infrastructure.
#
# Only Postgres for now. Redis arrives with the realtime step, when there is
# something to fan out; adding it early would be a service nobody starts for a
# reason nobody remembers.
#
#   docker compose up -d
#   docker compose logs -f postgres
#   docker compose down          # keeps data
#   docker compose down -v       # drops the volume too

services:
  postgres:
    image: postgres:17-alpine
    container_name: exam-control-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam_local_dev
      POSTGRES_DB: exam_control
      # Deterministic collation, so ORDER BY on candidate names does not depend
      # on the host's locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # Postgres allows 100 connections out of the box. A lab of sixty arriving
    # at once, across more than one API worker, reaches that — and the symptom
    # is not a slow page: the request waits on the pool and then fails, which
    # for a candidate is a sign-in that does not work.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
    ports:
      # Not 5432: a machine may already run Postgres there, and a dev database
      # quietly binding the default port is a bad surprise. Overridable because
      # 5433 collides too once you have more than one project on the go —
      # export EXAM_DB_PORT and set EXAM_DATABASE_URL to match.
      # 5433 and 5434 are taken by other projects on this machine, so the
      # default is 5435 — the same port backend/.env.example carries. A default
      # that disagrees with the application's own configuration is a setup trap
      # rather than a default.
      - "${EXAM_DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Alembic and the API both wait on this, so migrations never race startup.
      test: ["CMD-SHELL", "pg_isready -U exam -d exam_control"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: exam-control-redis
    # Fan-out only. Every durable fact lives in Postgres, so losing Redis
    # costs live updates and heartbeat freshness, never an exam.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${EXAM_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    name: exam_control_postgres_data
